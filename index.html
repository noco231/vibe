<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="scripts/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe — Вход</title>
  <link rel="stylesheet" href="style/auth.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f7cf7">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "2d956226-2dc7-44d7-bcaa-55bb7ec14fb9",
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "/sw.js",
        notifyButton: { enable: false }
      });
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => console.log("✅ Service Worker зарегистрирован:", reg.scope))
          .catch((err) => console.warn("❌ Ошибка SW:", err));
      });
    }
  </script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinChatId = urlParams.get("join");
    if (joinChatId) {
      localStorage.setItem("pendingJoin", joinChatId);
      console.log("Запомнили join:", joinChatId);
    }
  </script>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-box glass">
    <h1>Vibe</h1>
    <p class="subtitle" id="subtitle">Войди, чтобы начать общение</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="link">По ссылке</button>
      <button class="auth-tab" data-tab="password">С паролем</button>
    </div>

    <div class="auth-tab-content active" data-tab="link">
      <input type="email" id="email" placeholder="Email" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="sendLinkBtn">Отправить ссылку</button>
    </div>

    <div class="auth-tab-content" data-tab="password">
      <input type="email" id="emailPwd" placeholder="Email" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <input type="password" id="password" placeholder="Пароль" autocomplete="new-password">
      <button id="loginBtn">Войти</button>
      <button id="registerBtn" class="secondary">Зарегистрироваться</button>
    </div>

    <p id="statusMsg"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/auth.js"></script>
</body>
</html>
