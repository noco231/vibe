<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="scripts/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Настройки — My Messenger</title>
  <link rel="stylesheet" href="style/pages.css">
  <script src="scripts/theme.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f7cf7">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => console.log("✅ Service Worker зарегистрирован:", reg.scope))
          .catch((err) => console.warn("❌ Ошибка SW:", err));
      });
    }
  </script>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="page">
    <header class="page-header">
      <a href="chat.html" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1>Настройки</h1>
    </header>

    <div class="content">

      <!-- ВЫБОР ТЕМЫ -->
            <div class="setting-row" style="display:block;">
        <div class="setting-title" style="margin-bottom:14px;">Тема оформления</div>
        <div class="theme-grid">
          <button class="theme-item" data-theme="blue"   style="--c:#3b82f6;" title="Синяя"></button>
          <button class="theme-item" data-theme="red"    style="--c:#ef4444;" title="Красная"></button>
          <button class="theme-item" data-theme="green"  style="--c:#22c55e;" title="Зелёная"></button>
          <button class="theme-item" data-theme="orange" style="--c:#f97316;" title="Оранжевая"></button>
          <button class="theme-item" data-theme="purple" style="--c:#a855f7;" title="Фиолетовая"></button>
          <button class="theme-item" data-theme="black"  style="--c:#111111;" title="Чёрная"></button>
          <button class="theme-item" data-theme="white"  style="--c:#ffffff;" title="Белая"></button>
          <button class="theme-item" data-theme="yellow" style="--c:#eab308;" title="Жёлтая"></button>
        </div>
      </div>
    
      <div class="setting-row disabled">
        <div>
          <div class="setting-title">Уведомления</div>
          <div class="setting-desc">Скоро</div>
        </div>
        <label class="switch">
          <input type="checkbox" disabled>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row disabled">
        <div>
          <div class="setting-title">Язык</div>
          <div class="setting-desc">Русский (скоро выбор)</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/nav.js"></script>
  <script src="scripts/settings.js"></script>
</body>
</html>
