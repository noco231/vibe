<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Профиль — My Messenger</title>
  <link rel="stylesheet" href="style/pages.css">
  <script src="scripts/theme.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f7cf7">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => console.log("✅ Service Worker зарегистрирован:", reg.scope))
          .catch((err) => console.warn("❌ Ошибка SW:", err));
      });
    }
  </script>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="page">
    <header class="page-header">
      <a href="chat.html" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <h1>Профиль</h1>
    </header>

    <div class="content">
      <!-- Аватарка -->
      <div class="avatar-block">
        <div class="avatar-big" id="avatarPreview">?</div>
        <input type="file" id="avatarInput" accept="image/*" hidden>
        <button class="btn" id="changeAvatarBtn">📷 Изменить аватарку</button>
      </div>

      <!-- Ник -->
      <div class="form-block">
        <label class="form-label">Ник</label>
        <div class="form-row">
          <input type="text" id="nickInput" placeholder="Придумай ник" maxlength="24">
          <button class="btn primary" id="saveNickBtn" style="flex:0 0 auto; padding:15px 20px;">OK</button>
        </div>
        <div class="form-hint" id="nickStatus"></div>
      </div>

      <!-- Email -->
      <div class="form-block">
        <label class="form-label">Email</label>
        <input type="text" id="emailDisplay" disabled>
      </div>

      <!-- Пароль -->
      <div class="form-block">
        <label class="form-label">Пароль</label>
        <div id="passwordBlock"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/nav.js"></script>
  <script src="scripts/profile.js"></script>
</body>
</html>
