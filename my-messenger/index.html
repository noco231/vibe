<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe — Вход</title>
  <link rel="stylesheet" href="style/auth.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f7cf7">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="auth-box glass">
    <h1>Vibe</h1>
    <p class="subtitle" id="subtitle">Войди, чтобы начать общение</p>

    <!-- Вкладки -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="link">По ссылке</button>
      <button class="auth-tab" data-tab="password">С паролем</button>
    </div>

    <!-- Вкладка: по ссылке -->
    <div class="auth-tab-content active" data-tab="link">
      <input type="email" id="email" placeholder="Email">
      <button id="sendLinkBtn">Отправить ссылку</button>
    </div>

    <!-- Вкладка: по паролю -->
    <div class="auth-tab-content" data-tab="password">
      <input type="email" id="emailPwd" placeholder="Email">
      <input type="password" id="password" placeholder="Пароль">
      <button id="loginBtn">Войти</button>
      <button id="registerBtn" class="secondary">Зарегистрироваться</button>
    </div>

    <p id="statusMsg"></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/auth.js"></script>
</body>
</html>
